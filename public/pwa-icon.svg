<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Fondo NES negro -->
  <rect width="32" height="32" fill="#0c0a18"/>

  <!-- Mjölnir — cabeza dorada -->
  <rect x="6"  y="8"  width="20" height="2" fill="#d9a441"/>
  <rect x="4"  y="10" width="24" height="2" fill="#d9a441"/>
  <rect x="4"  y="12" width="24" height="2" fill="#fcbc2c"/>
  <rect x="4"  y="14" width="24" height="2" fill="#fcbc2c"/>
  <rect x="4"  y="16" width="24" height="2" fill="#d9a441"/>
  <rect x="6"  y="18" width="20" height="2" fill="#d9a441"/>

  <!-- Detalle rúnico blanco en la cabeza -->
  <rect x="12" y="11" width="2" height="2" fill="#fcfcfc"/>
  <rect x="18" y="11" width="2" height="2" fill="#fcfcfc"/>
  <rect x="14" y="13" width="4" height="2" fill="#fcfcfc"/>
  <rect x="15" y="15" width="2" height="2" fill="#fcfcfc"/>

  <!-- Mango de madera -->
  <rect x="14" y="20" width="4" height="2" fill="#6b3700"/>
  <rect x="14" y="22" width="4" height="2" fill="#6b3700"/>
  <rect x="14" y="24" width="4" height="2" fill="#6b3700"/>
  <rect x="14" y="26" width="4" height="2" fill="#6b3700"/>

  <!-- Pomo dorado -->
  <rect x="12" y="28" width="8" height="2" fill="#d9a441"/>
</svg>
